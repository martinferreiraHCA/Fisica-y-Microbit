<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Circuitos · fisicabit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root { --tenue:#555; --fondo:#ededed; }
* { box-sizing:border-box; }
html, body { height:100%; margin:0; }
body { font-family:'Montserrat', -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; font-size:12.5px; color:#000; background:var(--fondo); display:flex; flex-direction:column; overflow:hidden; }
button, input, select, textarea { font-family:inherit; font-size:inherit; color:inherit; }
/* Botón fisicabit: blanco, borde negro, mayúsculas, hover invertido */
.btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; background:#fff; color:#000; border:2px solid #000; border-radius:0; padding:6px 11px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.4px; cursor:pointer; white-space:nowrap; line-height:1.2; transition:background .15s, color .15s; }
.btn:hover { background:#000; color:#fff; }
.btn.pri { background:#000; color:#fff; } .btn.pri:hover { background:#333; border-color:#333; }
.btn.act { background:#000; color:#fff; }
.btn.chico { padding:3px 7px; font-size:10px; border-width:1.5px; }
.btn:disabled { opacity:.35; pointer-events:none; }
.btn.ancho { width:100%; }
[hidden] { display:none !important; }
/* Barra superior */
.barra { display:flex; align-items:center; gap:8px; background:#fff; border-bottom:2px solid #000; padding:7px 12px; flex:none; flex-wrap:wrap; }
.marca { font-size:15px; letter-spacing:.2px; margin-right:6px; white-space:nowrap; } .marca b { font-weight:800; } .marca span { font-weight:300; }
.marca i { font-style:normal; display:inline-block; background:#000; color:#fff; padding:2px 8px; margin-left:8px; font-size:10px; font-weight:700; letter-spacing:.8px; text-transform:uppercase; vertical-align:2px; }
.btn.sitio { text-transform:none; text-decoration:none; font-size:15px; font-weight:400; letter-spacing:.2px; padding:2px 10px; } .btn.sitio .lg span { font-weight:300; } .btn.sitio .lg b { font-weight:800; }
.marca .logo { display:none; } .marca.sola .logo { display:inline; } .marca .logo + i { margin-left:0; } .marca.sola .logo + i { margin-left:8px; }
@media (max-width:1360px) { .barra .nombre { width:120px; } }
.tabs { display:flex; } .tabs .btn + .btn { border-left:0; }
.hueco { flex:1; }
.barra .nombre { width:170px; border:1.5px solid #000; border-radius:999px; padding:5px 14px; font-weight:600; background:#fff; } .nombre::placeholder { color:#999; font-weight:500; }
#estado { flex:1 1 0; min-width:0; text-align:right; font-size:11px; color:var(--tenue); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
#estado.err { color:#c62828; font-weight:600; }
.pista.fuerte { color:#000; font-weight:600; border-color:#000; }
/* Cuerpo */
.cuerpo { flex:1; min-height:0; display:grid; grid-template-columns:262px 1fr 304px; }
.lado { background:#fff; overflow:auto; padding:12px; }
.lado.izq { display:flex; flex-direction:column; padding:0; overflow:hidden; }
.lado.izq { border-right:2px solid #000; } .lado.der { border-left:2px solid #000; }
.tit { font-size:10px; font-weight:800; letter-spacing:1.4px; text-transform:uppercase; border-bottom:2px solid #000; padding-bottom:4px; margin:16px 0 8px; }
.tit:first-child { margin-top:0; }
.nota { font-size:11px; color:var(--tenue); line-height:1.45; }
/* Catálogo de componentes: buscador arriba, categorías plegables con scroll propio */
.cat-cab { padding:12px 12px 8px; border-bottom:2px solid #000; flex:none; }
.cat-cab .tit { margin-bottom:8px; display:flex; justify-content:space-between; align-items:baseline; } .cat-cab .tit span { font-weight:600; letter-spacing:.3px; text-transform:none; color:var(--tenue); }
.buscar { position:relative; } .buscar input[type=text] { width:100%; border:2px solid #000; padding:7px 28px 7px 9px; font-weight:600; } .buscar input::placeholder { color:#999; font-weight:500; }
.buscar kbd { position:absolute; right:7px; top:50%; transform:translateY(-50%); font:700 10px/1 inherit; border:1.5px solid #bbb; color:#888; padding:2px 5px; pointer-events:none; }
.buscar input:focus + kbd, .buscar input:not(:placeholder-shown) + kbd { display:none; }
.cat-cab .chk { margin:7px 0 0; font-size:10.5px; color:var(--tenue); }
#catalogo { flex:1; min-height:0; overflow:auto; padding:0 0 10px; }
.cat-g { display:flex; align-items:center; gap:6px; width:100%; background:#fff; border:0; border-bottom:1px solid #d4d4d4; padding:8px 12px; cursor:pointer; font-size:10px; font-weight:800; letter-spacing:1.1px; text-transform:uppercase; text-align:left; }
.cat-g:hover { background:#f1f1f1; } .cat-g i { font-style:normal; font-size:9px; width:9px; } .cat-g b { flex:1; font-weight:800; } .cat-g span { font-weight:600; color:var(--tenue); letter-spacing:0; }
.cat-g.abierta { border-bottom-color:#000; }
.cat-l { padding:4px 8px 8px; border-bottom:1px solid #d4d4d4; }
.comp { display:flex; align-items:center; gap:8px; width:100%; background:#fff; border:1.5px solid transparent; padding:3px 5px; cursor:pointer; font-size:10.5px; font-weight:600; line-height:1.2; text-align:left; min-height:36px; }
.comp svg { flex:none; width:50px; height:30px; display:block; pointer-events:none; }
.comp span { flex:1; min-width:0; } .comp small { display:block; font-weight:500; font-size:9px; color:var(--tenue); }
.comp:hover { border-color:#bbb; } .comp.act { border-color:#000; background:#000; color:#fff; } .comp.act svg { filter:invert(1); } .comp.act small { color:#ddd; }
.comp.otra { opacity:.5; }
/* En la protoboard: mosaico de dos columnas, con la miniatura grande y el nombre debajo */
.mosaico .cat-l { display:grid; grid-template-columns:1fr 1fr; gap:6px; padding:8px; }
.mosaico .comp { flex-direction:column; justify-content:flex-start; gap:4px; padding:7px 4px 6px; text-align:center; border:1.5px solid #e2e2e2; min-height:96px; }
.mosaico .comp svg { width:100%; height:58px; }
.mosaico .comp span { flex:none; width:100%; font-size:10px; overflow-wrap:anywhere; }
.mosaico .comp:hover { border-color:#000; }
.mosaico .comp.act { background:#fff; color:#000; border:2.5px solid #000; padding:6px 3px 5px; } .mosaico .comp.act svg { filter:none; } .mosaico .comp.act small { color:var(--tenue); }
.mosaico .comp.otra svg { height:20px; }
.cat-vacio { padding:16px 12px; font-size:11px; color:var(--tenue); line-height:1.5; }
.cat-res { padding:8px 12px 4px; font-size:10px; font-weight:700; letter-spacing:.5px; text-transform:uppercase; color:var(--tenue); }
/* Ficha del componente */
.ficha { font-size:11.5px; line-height:1.5; } .ficha p { margin:6px 0; }
.ficha .sub { font-size:9.5px; font-weight:800; letter-spacing:1.1px; text-transform:uppercase; margin:13px 0 4px; border-bottom:1.5px solid #000; padding-bottom:2px; display:flex; justify-content:space-between; align-items:center; }
.ficha .fis { background:#f5f5f5; border-left:3px solid #000; padding:6px 9px; margin:8px 0; } .ficha .fis b { font-size:9.5px; letter-spacing:.8px; text-transform:uppercase; }
.ficha table { width:100%; border-collapse:collapse; font-size:11px; } .ficha td { padding:3px 0; border-bottom:1px solid #ddd; vertical-align:top; } .ficha td:first-child { color:var(--tenue); padding-right:8px; width:42%; } .ficha td.pn { font-weight:800; width:1%; white-space:nowrap; color:#000; }
.hoja { display:block; text-align:center; margin-top:10px; text-decoration:none; }
.ficha ul { list-style:none; margin:4px 0; padding:0; } .ficha li { position:relative; padding:2px 0 2px 17px; } .ficha li::before { position:absolute; left:0; top:2px; font-weight:800; content:'▲'; font-size:9px; top:4px; }
.ficha ul.si li::before { content:'✓'; font-size:11px; top:2px; } .ficha ul.no li::before { content:'✕'; font-size:11px; top:2px; } .ficha ul.nt li::before { content:'●'; font-size:7px; top:6px; left:2px; }
.vers { display:flex; } .vers .btn + .btn { border-left:0; }
.chips { display:flex; flex-wrap:wrap; gap:3px; margin-top:4px; } .chip { border:1.5px solid #000; background:#fff; font-size:9.5px; font-weight:700; padding:2px 5px; cursor:pointer; min-width:30px; } .chip:hover { background:#e6e6e6; } .chip.sel { background:#000; color:#fff; } .chip.pot { border-style:double; border-width:3px; padding:0 4px; }
.pin-t { font-size:13px; font-weight:800; margin:10px 0 0; } .pin-r { font-size:10.5px; color:var(--tenue); margin:1px 0 4px; }
/* Avisos de compatibilidad */
#avisos { position:absolute; right:10px; top:10px; width:330px; max-width:calc(100% - 20px); max-height:calc(100% - 60px); overflow:auto; background:#fff; border:2px solid #000; z-index:4; box-shadow:4px 4px 0 rgba(0,0,0,.12); }
.av-cab { display:flex; justify-content:space-between; align-items:center; padding:7px 10px; border-bottom:2px solid #000; font-size:10px; font-weight:800; letter-spacing:1.2px; text-transform:uppercase; position:sticky; top:0; background:#fff; }
.av { display:grid; grid-template-columns:22px 1fr; gap:2px 6px; padding:8px 10px; border-bottom:1px solid #d4d4d4; cursor:pointer; font-size:11px; line-height:1.45; } .av:last-child { border-bottom:0; }
.av:hover, .av.fijo { background:#f1f1f1; } .av i { font-style:normal; width:18px; height:18px; display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:800; border:1.5px solid #000; }
.av.error i { background:#000; color:#fff; } .av.info i { border-radius:50%; font-size:7px; } .av b { font-weight:800; } .av span { grid-column:2; color:#333; }
.av-ok { padding:10px; font-size:11px; color:var(--tenue); }
/* Vínculo entre las dos vistas */
.menu.vinc { min-width:340px; padding:10px 12px; font-size:11.5px; line-height:1.45; }
.vinc-t { font-size:9.5px; font-weight:800; letter-spacing:1.1px; text-transform:uppercase; border-bottom:1.5px solid #000; padding-bottom:3px; margin-bottom:5px; }
.vinc-d { padding:3px 0 3px 14px; position:relative; border-bottom:1px solid #e2e2e2; } .vinc-d::before { content:'▲'; position:absolute; left:0; top:5px; font-size:8px; }
.vinc-p { color:var(--tenue); margin-top:7px; } .vinc-ok { color:#000; }
/* Menú de ejemplos */
.con-menu { position:relative; } .menu { position:absolute; left:0; top:100%; margin-top:4px; min-width:300px; background:#fff; border:2px solid #000; z-index:6; box-shadow:4px 4px 0 rgba(0,0,0,.12); }
.menu button { display:block; width:100%; text-align:left; background:#fff; border:0; border-bottom:1px solid #d4d4d4; padding:8px 10px; cursor:pointer; font-size:11.5px; font-weight:700; } .menu button:last-child { border-bottom:0; } .menu button:hover { background:#000; color:#fff; } .menu small { display:block; font-weight:500; font-size:10px; opacity:.75; }
/* Formularios */
label.c { display:block; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; margin:9px 0 3px; }
input[type=text], select { width:100%; border:1.5px solid #000; border-radius:0; background:#fff; padding:5px 6px; }
.chk { display:flex; align-items:center; gap:7px; margin:9px 0 2px; font-size:11.5px; cursor:pointer; } .chk input { accent-color:#000; }
.grupo-btn { display:flex; flex-wrap:wrap; gap:5px; margin-top:10px; }
.colores { display:flex; flex-wrap:wrap; gap:5px; }
.col { width:24px; height:24px; border:1.5px solid #000; cursor:pointer; padding:0; } .col.sel { outline:2px solid #000; outline-offset:2px; }
.tipo { font-size:14px; font-weight:800; margin:0 0 2px; }
/* Lienzo */
.centro { position:relative; min-width:0; min-height:0; display:flex; flex-direction:column; }
.herr { display:flex; flex-wrap:wrap; gap:5px; align-items:center; padding:7px 8px; background:#fff; border-bottom:2px solid #000; }
.herr .sep { width:2px; align-self:stretch; background:#000; opacity:.15; margin:0 2px; }
.herr .btn { padding:6px 8px; } .herr .par { display:flex; } .herr .par .btn + .btn { border-left:0; }
.herr select { width:auto; padding:4px 5px; font-size:11px; font-weight:600; }
#visor { flex:1; min-height:0; position:relative; background:#fff; overflow:hidden; }
#lienzo { position:absolute; inset:0; width:100%; height:100%; display:block; outline:none; touch-action:none; user-select:none; -webkit-user-select:none; }
#lienzo text { user-select:none; -webkit-user-select:none; }
#lienzo.crear { cursor:crosshair; } #lienzo.mano { cursor:grabbing; }
#lienzo [data-id] { cursor:pointer; }
.pista { position:absolute; left:12px; bottom:10px; font-size:10.5px; color:var(--tenue); background:rgba(255,255,255,.9); padding:4px 8px; border:1px solid #ccc; pointer-events:none; max-width:calc(100% - 24px); }
/* Cuadro del código de colores */
.modal { position:fixed; inset:0; background:rgba(0,0,0,.45); display:none; align-items:center; justify-content:center; z-index:50; } .modal.abierto { display:flex; }
.caja { background:#fff; border:2px solid #000; width:min(520px, 94vw); max-height:92vh; display:flex; flex-direction:column; }
.caja-cab { display:flex; justify-content:space-between; align-items:center; padding:9px 12px; border-bottom:2px solid #000; font-weight:800; letter-spacing:1px; text-transform:uppercase; font-size:11.5px; }
.caja-cuerpo { padding:12px 16px 16px; overflow:auto; }
#r-vista { display:block; width:100%; height:92px; }
#r-texto { text-align:center; font-size:20px; font-weight:800; margin:2px 0 10px; }
.r-fila { display:grid; grid-template-columns:104px 1fr; gap:8px; align-items:center; margin-top:7px; }
.r-fila > span { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; } .r-fila small { display:block; font-weight:500; text-transform:none; letter-spacing:0; color:var(--tenue); }
.r-bandas { display:flex; flex-wrap:wrap; gap:4px; }
.r-bandas .col { width:22px; height:22px; }
.rapidos { display:flex; flex-wrap:wrap; gap:4px; margin-top:6px; } .rapidos .btn { text-transform:none; }
.pie-caja { display:flex; justify-content:flex-end; gap:8px; margin-top:16px; }
@media (max-width: 900px) { .cuerpo { grid-template-columns:200px 1fr; } .lado.der { display:none; } }
</style>
</head>
<body>
<div class="barra">
  <a class="btn sitio" id="b-sitio" href="../" title="Volver al inicio de fisicabit.com"><span>←</span><span class="lg"><span>fisica</span><b>bit</b></span></a>
  <div class="marca" id="marca"><span class="logo"><span>fisica</span><b>bit</b></span><i>Circuitos</i></div>
  <input type="text" class="nombre" id="n-circ" placeholder="Nombre del circuito">
  <div class="tabs"><button class="btn act" id="tab-esq">1 · Esquemático</button><button class="btn" id="tab-proto">2 · Protoboard</button></div>
  <button class="btn" id="b-generar" title="Arma la otra pestaña con los mismos componentes y las mismas conexiones">Generar protoboard →</button>
  <div class="con-menu"><button class="btn chico" id="b-vinc" hidden></button><div class="menu vinc" id="m-vinc" hidden></div></div>
  <span id="estado">Listo.</span>
  <button class="btn pri" id="b-insertar" hidden title="Agrega este dibujo al protocolo de práctico">Insertar en el protocolo</button>
  <button class="btn" id="b-nuevo" title="Empezar un circuito vacío">Nuevo</button>
  <button class="btn" id="b-abrir" title="Abrir un circuito guardado (.circuito.json)">Abrir</button>
  <button class="btn" id="b-guardar" title="Descargar el circuito para seguir después (.circuito.json)">Guardar</button>
  <button class="btn" id="b-svg" title="Descargar el dibujo de esta pestaña como SVG (vectorial)">SVG</button>
  <button class="btn" id="b-png" title="Descargar el dibujo de esta pestaña como imagen PNG">PNG</button>
  <input type="file" id="f-abrir" accept=".json" hidden>
</div>

<div class="cuerpo">
  <div class="lado izq">
    <div class="cat-cab">
      <div class="tit">Componentes <span id="cat-total"></span></div>
      <div class="buscar"><input type="text" id="q" placeholder="Buscar componente…" autocomplete="off" spellcheck="false"><kbd>/</kbd></div>
      <label class="chk"><input type="checkbox" id="solo-tk"> Solo los que están en Tinkercad</label>
    </div>
    <div id="catalogo"></div>
  </div>

  <div class="centro">
    <div class="herr">
      <div class="par"><button class="btn act" id="h-sel" title="Elegir, mover y editar (Esc)">Seleccionar</button><button class="btn" id="h-cable" title="Trazar cables (C)">Cable</button></div>
      <span class="sep"></span>
      <div class="par"><button class="btn" id="h-deshacer" title="Deshacer (Ctrl+Z)">Deshacer</button><button class="btn" id="h-rehacer" title="Rehacer (Ctrl+Y)">Rehacer</button></div>
      <span class="sep"></span>
      <button class="btn" id="h-encuadrar" title="Ver todo el dibujo">Encuadrar</button>
      <div class="con-menu"><button class="btn" id="h-ejemplos" title="Circuitos listos para empezar">Ejemplos ▾</button><div class="menu" id="m-ej" hidden></div></div>
      <span class="hueco"></span>
      <button class="btn" id="h-avisos" hidden title="Problemas de compatibilidad con la micro:bit">Avisos</button>
      <div class="par" id="p-estilo" hidden title="Estilo del dibujo de la protoboard"><button class="btn" id="e-real">Realista</button><button class="btn" id="e-linea" title="En línea, blanco y negro: para imprimir">Línea</button></div>
      <select id="s-cols" title="Tamaño de la protoboard"><option value="30">30 columnas</option><option value="60">60 columnas</option></select>
      <select id="s-res" title="Símbolo de las resistencias del esquemático"><option value="iec">Resistencia: rectángulo</option><option value="zigzag">Resistencia: zigzag</option></select>
    </div>
    <div id="visor">
      <svg id="lienzo" tabindex="0" xmlns="http://www.w3.org/2000/svg">
        <defs id="defs-arte"></defs>
        <defs><pattern id="pat-grilla" x="-10" y="-10" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="10" cy="10" r="1" fill="#c4c4c4"/></pattern></defs>
        <g id="mundo">
          <rect id="grilla" x="-6000" y="-6000" width="12000" height="12000" fill="url(#pat-grilla)" pointer-events="none"/>
          <g id="g-contenido"></g>
          <g id="g-sobre"></g>
        </g>
      </svg>
      <div id="avisos" hidden></div>
      <div class="pista" id="pista"></div>
    </div>
  </div>

  <div class="lado der" id="insp"></div>
</div>

<!-- Código de colores de una resistencia -->
<div class="modal" id="m-res">
  <div class="caja">
    <div class="caja-cab"><span>Resistencia · código de colores</span><button class="btn chico" id="r-cerrar">Cerrar</button></div>
    <div class="caja-cuerpo">
      <svg id="r-vista" viewBox="0 0 300 92" xmlns="http://www.w3.org/2000/svg"></svg>
      <div id="r-texto"></div>
      <div class="r-fila"><span>Valor<small>220 · 4.7k · 4k7 · 1M</small></span><input type="text" id="r-valor" autocomplete="off" spellcheck="false"></div>
      <div class="rapidos" id="r-rapidos"></div>
      <div class="r-fila" style="margin-top:14px"><span>Banda 1<small>primera cifra</small></span><div class="r-bandas" id="r-b1"></div></div>
      <div class="r-fila"><span>Banda 2<small>segunda cifra</small></span><div class="r-bandas" id="r-b2"></div></div>
      <div class="r-fila"><span>Banda 3<small>multiplicador</small></span><div class="r-bandas" id="r-b3"></div></div>
      <div class="r-fila"><span>Banda 4<small>tolerancia</small></span><div class="r-bandas" id="r-b4"></div></div>
      <div class="pie-caja"><button class="btn" id="r-cancelar">Cancelar</button><button class="btn pri" id="r-aceptar">Aceptar</button></div>
    </div>
  </div>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
